- name: print facts
  hosts: localhost
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg:  "{{ ansible_facts }}"

  - name: print some information
    debug:
      msg: |
        OS family: {{ ansible_facts['os_family'] }}
        private_ip; {{ ansible_facts.default_ipv4.address }}
        private_ip: {{ ansible_facts['default_ipv4']['address'] }}